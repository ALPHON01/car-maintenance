# Perfil de produccion (Render). Todo lo secreto llega por variables de entorno.

# --- Base de datos ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Crea/actualiza las tablas, sin borrarlas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Servidor (Render asigna el puerto y termina el HTTPS delante de la app) ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# --- Correo ---
app.mail.activo=${MAIL_ACTIVO:true}
app.url-base=${APP_URL}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO}
spring.mail.password=${MAIL_CLAVE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Subida de facturas ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB