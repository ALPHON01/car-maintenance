<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('registro')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">

            <h1 class="h3 fw-bold mb-1 text-center">Crear cuenta</h1>
            <p class="text-secondary text-center mb-4">Registra tus coches y su historial de mantenimiento.</p>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                   autocomplete="name" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   autocomplete="email">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña *</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="form-text" th:unless="${#fields.hasErrors('password')}">Mínimo 8 caracteres.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmarPassword" class="form-label">Repite la contraseña *</label>
                            <input type="password" class="form-control" id="confirmarPassword" th:field="*{confirmarPassword}"
                                   th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarPassword')}"
                                 th:errors="*{confirmarPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                    </form>
                </div>
            </div>

            <p class="text-center text-secondary mt-3">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </p>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
