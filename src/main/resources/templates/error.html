<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algo ha ido mal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('ninguna')}"></nav>

<main class="container py-5" th:with="usuario=${usuarioActual != null ? usuarioActual : session.SPRING_SECURITY_CONTEXT?.authentication?.principal}">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">

            <p class="display-1 fw-bold text-suave mb-2" th:text="${status}">500</p>

            <h1 class="h3 fw-bold mb-3">
                <span th:if="${titulo != null}" th:text="${titulo}"></span>
                <th:block th:if="${titulo == null}" th:switch="${'' + status}">
                    <span th:case="'404'">No encontramos lo que buscas</span>
                    <span th:case="'403'">No tienes permiso para ver esta página</span>
                    <span th:case="'401'">Tu sesión ya no es válida</span>
                    <span th:case="*">Algo ha ido mal</span>
                </th:block>
            </h1>

            <p class="text-suave mb-4" th:if="${mensaje != null}" th:text="${mensaje}"></p>
            <p class="text-suave mb-4" th:if="${mensaje == null and '' + status == '401'}">
                Vuelve a iniciar sesión para continuar.
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a class="btn btn-primary" th:href="@{/}">Ir al inicio</a>
                <a class="btn btn-outline-secondary" th:if="${usuario != null}"
                   th:href="@{/vehiculos}">Mis vehículos</a>
                <a class="btn btn-outline-secondary" th:if="${usuario == null}"
                   th:href="@{/login}">Iniciar sesión</a>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
