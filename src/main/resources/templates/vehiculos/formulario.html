<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Añadir vehículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('nuevo')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <h1 class="h3 fw-bold mb-1">Añadir vehículo</h1>
            <p class="text-secondary mb-4">Los campos marcados con * son obligatorios.</p>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/vehiculos}" th:object="${vehiculo}" method="post" novalidate>

                        <!-- Necesario cuando reutilicemos este formulario para editar -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="marca" class="form-label">Marca *</label>
                                <input type="text" class="form-control" id="marca" th:field="*{marca}"
                                       th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'"
                                       placeholder="Seat" autofocus>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}"
                                     th:errors="*{marca}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="modelo" class="form-label">Modelo *</label>
                                <input type="text" class="form-control" id="modelo" th:field="*{modelo}"
                                       th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'"
                                       placeholder="Ibiza">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}"
                                     th:errors="*{modelo}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="matricula" class="form-label">Matrícula *</label>
                                <input type="text" class="form-control" id="matricula" th:field="*{matricula}"
                                       th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'"
                                       placeholder="1234 ABC">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}"
                                     th:errors="*{matricula}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="kilometrajeActual" class="form-label">Kilometraje actual</label>
                                <div class="input-group has-validation">
                                    <input type="number" min="0" class="form-control" id="kilometrajeActual"
                                           th:field="*{kilometrajeActual}"
                                           th:classappend="${#fields.hasErrors('kilometrajeActual')} ? 'is-invalid'"
                                           placeholder="85000">
                                    <span class="input-group-text">km</span>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('kilometrajeActual')}"
                                         th:errors="*{kilometrajeActual}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="fechaCompra" class="form-label">Fecha de compra</label>
                                <input type="date" class="form-control" id="fechaCompra" th:field="*{fechaCompra}"
                                       th:classappend="${#fields.hasErrors('fechaCompra')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaCompra')}"
                                     th:errors="*{fechaCompra}"></div>
                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Guardar vehículo</button>
                            <a class="btn btn-outline-secondary" th:href="@{/vehiculos}">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
