<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .fila-clic { cursor: pointer; }
    </style>
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('vehiculos')}"></nav>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Mis vehículos</h1>
            <p class="text-secondary mb-0" th:unless="${#lists.isEmpty(vehiculos)}">
                <span th:text="${#lists.size(vehiculos)} == 1 ? '1 vehículo registrado' : ${#lists.size(vehiculos)} + ' vehículos registrados'"></span>
                · Haz clic en un vehículo para abrir su ficha.
            </p>
        </div>
        <a class="btn btn-primary" th:href="@{/vehiculos/nuevo}">Añadir vehículo</a>
    </div>

    <!-- Sin vehículos -->
    <div class="card shadow-sm" th:if="${#lists.isEmpty(vehiculos)}">
        <div class="card-body text-center py-5">
            <h2 class="h5">Todavía no tienes ningún vehículo</h2>
            <p class="text-secondary mb-4">
                Añade tu primer coche para empezar a registrar sus visitas al taller.
            </p>
            <a class="btn btn-primary" th:href="@{/vehiculos/nuevo}">Añadir mi primer vehículo</a>
        </div>
    </div>

    <!-- Listado -->
    <div class="card shadow-sm" th:unless="${#lists.isEmpty(vehiculos)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Matrícula</th>
                    <th scope="col">Marca</th>
                    <th scope="col">Modelo</th>
                    <th scope="col" class="text-end">Kilometraje</th>
                    <th scope="col">Fecha de compra</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehiculos}" class="fila-clic"
                    th:data-href="@{/vehiculos/{id}(id=${v.id})}">
                    <td class="fw-semibold">
                        <!-- Enlace real: permite abrir en otra pestaña, usar el teclado y lectores de pantalla -->
                        <a class="text-reset text-decoration-none" th:href="@{/vehiculos/{id}(id=${v.id})}"
                           th:text="${v.matricula}"></a>
                    </td>
                    <td th:text="${v.marca}"></td>
                    <td th:text="${v.modelo}"></td>
                    <td class="text-end"
                        th:text="${v.kilometrajeActual != null} ? ${#numbers.formatInteger(v.kilometrajeActual, 1, 'POINT')} + ' km' : '—'"></td>
                    <td th:text="${v.fechaCompra != null} ? ${#temporals.format(v.fechaCompra, 'dd/MM/yyyy')} : '—'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Clic en cualquier parte de la fila: abre la ficha (Ctrl/Cmd + clic, en otra pestaña)
    document.querySelectorAll('tr[data-href]').forEach(function (fila) {
        fila.addEventListener('click', function (e) {
            if (e.target.closest('a')) { return; }   // el enlace de la matrícula ya navega solo
            var destino = fila.dataset.href;
            if (e.ctrlKey || e.metaKey) {
                window.open(destino, '_blank');
            } else {
                window.location.href = destino;
            }
        });
    });
</script>
</body>
</html>
