<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('talleres')}"></nav>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Talleres</h1>
            <p class="text-secondary mb-0">Los talleres donde llevas tus coches.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/talleres/nuevo}">Añadir taller</a>
    </div>

    <!-- Mensajes tras guardar o eliminar -->
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Sin talleres -->
    <div class="card shadow-sm" th:if="${#lists.isEmpty(talleres)}">
        <div class="card-body text-center py-5">
            <h2 class="h5">Todavía no hay talleres</h2>
            <p class="text-secondary mb-4">
                Añade un taller para poder elegirlo al registrar una visita.
            </p>
            <a class="btn btn-primary" th:href="@{/talleres/nuevo}">Añadir el primer taller</a>
        </div>
    </div>

    <!-- Listado -->
    <div class="card shadow-sm" th:unless="${#lists.isEmpty(talleres)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Teléfono</th>
                    <th scope="col">Dirección</th>
                    <th scope="col"><span class="visually-hidden">Acciones</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${talleres}">
                    <td class="fw-semibold" th:text="${t.nombre}"></td>
                    <td th:text="${t.telefono != null and !#strings.isEmpty(t.telefono)} ? ${t.telefono} : '—'"></td>
                    <td th:text="${t.direccion != null and !#strings.isEmpty(t.direccion)} ? ${t.direccion} : '—'"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/talleres/{id}/editar(id=${t.id})}">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/talleres/{id}/eliminar(id=${t.id})}"
                              onsubmit="return confirm('¿Seguro que quieres eliminar este taller?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
