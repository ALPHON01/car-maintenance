<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${taller.id == null} ? 'Añadir taller' : 'Editar taller'">Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/header :: header('talleres')}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/talleres}">Talleres</a></li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${taller.id == null} ? 'Nuevo' : 'Editar'"></li>
                </ol>
            </nav>

            <h1 class="h3 fw-bold mb-1" th:text="${taller.id == null} ? 'Añadir taller' : 'Editar taller'"></h1>
            <p class="text-secondary mb-4">Los campos marcados con * son obligatorios.</p>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/talleres}" th:object="${taller}" method="post" novalidate>

                        <!-- Con id se actualiza el taller; sin id se crea uno nuevo -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">

                            <div class="col-12">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                       placeholder="Taller Hermanos García" autofocus>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" th:field="*{telefono}"
                                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                       placeholder="600 123 456">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}"
                                     th:errors="*{telefono}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" th:field="*{direccion}"
                                       th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'"
                                       placeholder="Calle Sierpes 12, Sevilla">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}"
                                     th:errors="*{direccion}"></div>
                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Guardar taller</button>
                            <a class="btn btn-outline-secondary" th:href="@{/talleres}">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
