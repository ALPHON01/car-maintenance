<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" role="img" aria-label="Berlina deportiva de perfil" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pintura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8946a"/>
      <stop offset="0.42" stop-color="#94613f"/>
      <stop offset="1" stop-color="#4a2e1d"/>
    </linearGradient>
    <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.5" stop-color="#1c2026"/>
      <stop offset="1" stop-color="#101317"/>
    </linearGradient>
    <radialGradient id="llanta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="1" stop-color="#a9a49c"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="carroceria" d="M44,234 L34,178 C34,152 40,128 56,120 L158,112 C215,106 272,60 346,40 C362,36 380,36 400,36 L470,36 C522,36 562,64 612,100 L620,106 L730,126 C770,132 788,148 792,172 L794,216 L786,234 L713,236 A64 64 0 1 0 591,236 L253,236 A64 64 0 1 0 131,236 L52,236 Z"/>
    <clipPath id="recorte"><use href="#carroceria"/></clipPath>
    <g id="rueda">
      <circle r="53" fill="#141416"/>
      <circle r="38" fill="url(#llanta)"/>
      <g stroke="#6f6a63" stroke-width="6" stroke-linecap="round">
        <path d="M0,-31 L0,-8" transform="rotate(0)"/>
        <path d="M0,-31 L0,-8" transform="rotate(72)"/>
        <path d="M0,-31 L0,-8" transform="rotate(144)"/>
        <path d="M0,-31 L0,-8" transform="rotate(216)"/>
        <path d="M0,-31 L0,-8" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#35373b"/>
    </g>
  </defs>

  <!-- Sombra en el suelo -->
  <ellipse cx="420" cy="272" rx="360" ry="9" fill="#000" opacity="0.25" filter="url(#sombra)"/>

  <!-- Interior de los pasos de rueda -->
  <path d="M131,236 A64 64 0 1 1 253,236 Z" fill="#0b0b0d"/>
  <path d="M591,236 A64 64 0 1 1 713,236 Z" fill="#0b0b0d"/>

  <!-- Ruedas -->
  <use href="#rueda" transform="translate(192,217)"/>
  <use href="#rueda" transform="translate(652,217)"/>

  <!-- Carrocería -->
  <use href="#carroceria" fill="url(#pintura)"/>
  <g clip-path="url(#recorte)">
    <path d="M30,200 L800,192 L800,245 L30,245 Z" fill="#000" opacity="0.2"/>
    <!-- Línea de carácter y pliegue inferior -->
    <path d="M60,146 C250,138 480,140 770,156" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="3"/>
    <path d="M270,206 C400,200 520,200 585,204" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
    <!-- Reflejos en techo y capó -->
    <path d="M346,40 C362,36 380,36 400,36 L470,36 C500,36 526,46 552,62" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M626,108 L728,128" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- Cristales -->
  <path d="M416,46 L468,46 C500,46 530,66 564,106 L416,106 Z" fill="url(#cristal)"/>
  <path d="M404,46 L404,106 L274,108 C262,110 252,108 244,104 C246,94 262,76 292,62 C330,48 372,46 404,46 Z" fill="url(#cristal)"/>
  <path d="M300,66 C326,56 356,52 384,51" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Líneas de puertas, tiradores y retrovisor -->
  <g stroke="#2d1a0f" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M296,112 L296,232"/>
    <path d="M410,106 L410,232"/>
    <path d="M552,112 L552,224"/>
  </g>
  <rect x="340" y="124" width="34" height="6" rx="3" fill="#2d1a0f" opacity="0.55"/>
  <rect x="452" y="124" width="34" height="6" rx="3" fill="#2d1a0f" opacity="0.55"/>
  <path d="M568,106 L592,103 C599,103 601,108 597,111 L576,113 Z" fill="#4a2e1d"/>

  <!-- Faros y parrilla (genéricos) -->
  <path d="M742,132 C768,136 786,148 790,160 L752,152 Z" fill="#f3f1ea"/>
  <path d="M752,152 L790,160 L790,168 L756,162 Z" fill="#e8c97a" opacity="0.9"/>
  <path d="M758,176 C776,178 788,184 790,196 L790,218 L768,222 C760,206 758,192 758,176 Z" fill="#111214"/>
  <!-- Piloto trasero en L -->
  <path d="M35,150 L52,128 L72,126 L48,152 L52,172 L36,176 Z" fill="#d1252b"/>
</svg>
